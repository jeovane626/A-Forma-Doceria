<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha - A Forma Doceria</title>
    <link rel="stylesheet" href="css/recuperacao.css" />
  </head>

  <body>
    <main class="container">
      <section class="card">
        <img
          src="imagens/logo.jpg"
          alt="Logo da Á Forma, Doceria"
          class="logo"
        />

        <h1>Recuperar senha</h1>

        <p>Digite o e-mail cadastrado na área administrativa.</p>

        <form id="formRecuperacao">
          <label for="email">E-mail</label>

          <input type="email" id="email" required />

          <button type="submit">Enviar link de recuperação</button>
        </form>

        <p id="mensagem"></p>

        <a href="login.html"> Voltar para o login </a>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/esqueci-senha.js"></script>
  </body>
</html>
