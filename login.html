<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login Administrativo - A Forma Doceria</title>

    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <main class="login-container">
      <section class="login-card">
        <img
          src="imagens/logo.jpg"
          alt="Logo da Á Forma, Doceria"
          class="logo"
        />

        <h1>A Forma Doceria</h1>

        <h2>Área Administrativa</h2>

        <form id="formLogin">
          <label for="email"> E-mail </label>

          <input type="email" id="email" name="email" required />
          <label for="senha"> Senha </label>
          <input type="password" id="senha" name="senha" required />
          <button type="submit">Entrar</button>
        </form>

        <p id="mensagem"></p>
        <a href="esqueci-senha.html" id="esqueciSenha"> Esqueci minha senha </a>
        <a href="index.html" class="voltar"> Voltar para a loja </a>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
