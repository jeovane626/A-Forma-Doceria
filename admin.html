<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel Administrativo - Á Forma, Doceria</title>

    <link rel="stylesheet" href="css/admin.css" />
  </head>

  <body>
    <header>
      <div>
        <h1>Á Forma, Doceria</h1>
        <p>Painel Administrativo</p>
      </div>

      <button id="botaoSair" type="button">Sair</button>
    </header>

    <main>
      <section class="topo-painel">
        <div>
          <h2>Produtos</h2>

          <p>Gerencie os produtos disponíveis na loja.</p>
        </div>

        <button id="botaoNovoProduto" type="button">+ Novo Produto</button>
      </section>

      <section id="formProdutoContainer" class="form-produto oculto">
        <h2 id="tituloFormulario">Cadastrar Produto</h2>

        <form id="formProduto">
          <input type="hidden" id="produtoId" />

          <label for="nomeProduto"> Nome </label>

          <input type="text" id="nomeProduto" required />

          <label for="descricaoProduto"> Descrição </label>

          <textarea id="descricaoProduto" rows="4"></textarea>

          <label for="precoProduto"> Preço </label>

          <input type="number" id="precoProduto" min="0" step="0.01" required />

          <label for="imagemProduto"> Foto do Produto </label>

          <input
            type="file"
            id="imagemProduto"
            accept="image/jpeg,image/png,image/webp"
          />

          <div id="imagemAtualContainer">
            <p id="imagemAtual"></p>

            <img
              id="previewImagemAtual"
              alt="Imagem atual do produto"
              style="display: none"
            />
          </div>

          <div class="botoes-formulario">
            <button type="submit" class="salvar">Salvar Produto</button>

            <button type="button" id="cancelarProduto" class="cancelar">
              Cancelar
            </button>
          </div>
        </form>
      </section>

      <p id="mensagem"></p>

      <section id="listaProdutosAdmin" class="lista-produtos"></section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
